name: Daily outreach cron

# Vercel's own Cron Jobs feature never registered these routes (confirmed
# via Observability > Cron Jobs showing zero invocations), so GitHub Actions
# triggers them instead — same endpoints, same CRON_SECRET auth, just a
# different, verifiable scheduler.
on:
  schedule:
    # Campaign sends are paused (2026-08-14) while the send pipeline is
    # reviewed — see campaign-send below, now workflow_dispatch-only.
    #
    # check-personal-inbox, calendar-sync, and lead-qual-callback-reminders
    # used to run here hourly (and 15-min before that), but GitHub Actions
    # was observed landing scheduled runs 1-5 hours apart instead of on time
    # (confirmed via run history — gaps like 21:16->23:21, and a full ~12hr
    # dead spot on 2026-09-14 that caused a booked meeting's day-before AND
    # 3-hours-before reminder to both silently never send). All three are now
    # driven by cron-job.org hitting the same bearer-protected routes every
    # 15 min instead — a real scheduler, not GitHub's best-effort one — so
    # they're gone from this workflow entirely rather than kept as a backup.
    - cron: "0 19 * * *"  # 7am NZT — morning brief (today's meetings + due items, via Slack)
    - cron: "0 21 * * *"  # 9am NZT — daily maintenance (replies, stale-reply pings, etc.)
    - cron: "0 18 * * *"  # 6am NZT — lead-qual daily sync (catch any Lead Ad forms the webhook missed)
    - cron: "0 0 * * *"  # 12pm NZT — lead-qual sync, second daily pass so a missed form doesn't sit until the next morning
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

jobs:
  campaign-send:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          curl -sf -X GET "https://app.lsgrowth.agency/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  morning-brief:
    # Not gated on github.event.schedule: when this workflow had multiple
    # schedules that could land on the same boundary, GitHub Actions fires a
    # single run and event.schedule reflects only one of them, so an
    # event.schedule match here could silently no-op. Wall-clock time avoids
    # that regardless of what else is in the schedule list.
    #
    # The window is 2 hours, not 15 minutes: this workflow's actual runs have
    # been observed landing 20-40+ minutes late (GitHub Actions scheduling
    # jitter, worse with multiple schedules in one workflow), and a run that
    # arrives just after a narrow window closes just gets silently skipped -
    # which is exactly what happened to this job every day until this fix.
    # Widening it is safe because the route itself (lib/morningBrief.ts) now
    # checks an "already ran today" flag in the DB before doing any work, so
    # multiple runs landing inside the window won't send duplicate Slack
    # messages or re-tag sheets twice.
    runs-on: ubuntu-latest
    steps:
      - name: Check if it's the 7am NZT (19:00-21:00 UTC) window
        id: check
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "19" ] || [ "$HOUR" = "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Call /api/cron/morning-brief
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X GET "https://app.lsgrowth.agency/api/cron/morning-brief" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  daily-maintenance:
    # Same event.schedule reasoning as morning-brief above, same 2-hour
    # window for the same reason, and safe for the same reason - the route now checks an "already ran today"
    # DB flag before doing any work (see api/cron/daily-maintenance/route.ts),
    # which matters more here than most: several of this route's steps call
    # the Anthropic API and aren't behind COLD_OUTREACH_PAUSED, so an
    # unguarded duplicate run would have re-billed those, not just wasted
    # Sheets/Drive quota.
    runs-on: ubuntu-latest
    steps:
      - name: Check if it's the 9am NZT (21:00-23:00 UTC) window
        id: check
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "21" ] || [ "$HOUR" = "22" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Call /api/cron/daily-maintenance
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X GET "https://app.lsgrowth.agency/api/cron/daily-maintenance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  lead-qual-sync:
    # Same event.schedule reasoning as morning-brief/daily-maintenance above
    # — check wall-clock instead of trusting event.schedule.
    # Runs twice a day (6am and 12pm NZT) so a lead the webhook missed in the
    # morning doesn't sit until the next day. No "already ran today" guard
    # needed: backfillLeadsForClient dedupes on leadgen_id, so a stray
    # double-run (or the two intentional daily runs) just costs a few extra
    # Graph API calls, not duplicate leads or duplicate Slack pings.
    runs-on: ubuntu-latest
    steps:
      - name: Check if it's the 6am or 12pm NZT window (18:00-19:59 or 00:00-01:59 UTC)
        id: check
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "18" ] || [ "$HOUR" = "19" ] || [ "$HOUR" = "00" ] || [ "$HOUR" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Call /api/cron/lead-qual-sync
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X GET "https://app.lsgrowth.agency/api/cron/lead-qual-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
